# mhdb extract 的解包清单。正则匹配以 / 开头、/ 分隔的游戏内路径，不区分大小写。
# 只解网站需要的文件，保持 data-raw/ 精简。

[world]
patterns = [
  # 文本：简中 / 繁中 / 日文 / 英文
  '^/common/text/.*_(chS|chT|jpn|eng)\.gmd$',

  # 装备、物品、玩家、随从、设施、怪物公共参数
  '^/common/equip/',
  '^/common/item/(itemData\.itm|itemMake\.imk|itemMakeType\.imt|skillGemParam\.sgpa|itemList\.itlist|pop_base\.ppm)$',
  # 物件（采集点等）的公共参数
  '^/common/gimmick/(gimmick|animal)\.gcd$',
  '^/common/note/em_animal_note\.emai$',
  # 怪物：狩猎笔记（弱点星级、可破坏部位、栖息地、素材）与受击判定（部位与肉质的对应）
  '^/common/note/em_note(\.emi|_rem_\w+\.emr)$',
  '^/em/em\d+/\d+/collision/em\d+\.col$',

  # 武器与猎人的攻击参数（动作值、补正、卡肉）
  '^/hm/(wp/wp\d\d|common|claw)/(shell/)?collision/.*\.col$',
  '^/common/pl/',
  '^/common/otomo/',
  '^/common/facility/',
  '^/common/em/[^/]+\.(dtt_\w+|ecp|em_ss)$',

  # 每只怪物的数据表（不含 THK 与动画）
  '^/em/em\d+/\d+/data/em\d+\.(dtt\w*|em\d+_dmg|em\d+_pbc)$',

  # 任务
  '^/quest/questData_\d+\.mib$',

  # 界面贴图
  '^/ui/(common|common_menu|equip|status|item_menu|note|map)/tex/.*\.tex$',
  # 小地图（雷达）贴图与关卡的雷达参数
  '^/ui/hud/tex/rtex/',
  '^/ui/quest/tex/maptex/',
  '^/stage/st\d+/common/etc/[^/]+\.radc$',
  # 关卡布置（采集点、营地等）、UI 区域与采集抽选表
  '^/stage/st\d+/common/set/[^/]+\.sobjl?$',
  '^/stage/st\d+/common/zone/[^/]+_ui\.zon$',
  '^/stage/st\d+/common/data/[^/]+\.itlot$',
  '^/ui/map/[^/]+\.gsp$',

  # 界面布局（.gui 引用贴图并给出精灵的裁切坐标；只取配装与地图相关的画面）
  '^/ui/(status|equip|common_menu|map|quest|hud)/[^/]+\.gui$',
]
